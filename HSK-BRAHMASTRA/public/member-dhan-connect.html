<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HSK BRAHMASTRA - Connect Dhan</title>

</head>


<body>

    <h2>🤖 HSK BRAHMASTRA</h2>


    <h3 id="pageTitle">
        Connect Your Dhan Account
    </h3>


    <div id="memberInfo">

        Loading member information...

    </div>


    <br>


    <form id="dhanConnectForm">


        <!-- ================================= -->
        <!-- DHAN CLIENT ID -->
        <!-- ================================= -->

        <div id="clientIdSection">

            <label>Dhan Client ID</label>

            <br>

            <input
                type="text"
                id="dhanClientId"
                placeholder="Enter Dhan Client ID"
                required
            >

        </div>


        <br>


        <!-- ================================= -->
        <!-- DHAN ACCESS TOKEN -->
        <!-- ================================= -->

        <label id="tokenLabel">

            Dhan Access Token

        </label>

        <br>

        <input
            type="password"
            id="dhanAccessToken"
            placeholder="Enter Today's Dhan Access Token"
            required
        >


        <br><br>


        <button
            type="submit"
            id="submitButton"
        >

            Connect Dhan

        </button>


    </form>


    <script>


        // ==========================================
        // GET TELEGRAM ID FROM URL
        // ==========================================

        const telegramId =
            window.location.pathname
                .split("/")
                .pop();


        // ==========================================
        // ELEMENTS
        // ==========================================

        const form =
            document.getElementById(
                "dhanConnectForm"
            );


        const dhanClientIdInput =
            document.getElementById(
                "dhanClientId"
            );


        const dhanAccessTokenInput =
            document.getElementById(
                "dhanAccessToken"
            );


        const memberInfo =
            document.getElementById(
                "memberInfo"
            );


        const pageTitle =
            document.getElementById(
                "pageTitle"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        // ==========================================
        // CHECK VALID DHAN CLIENT ID
        // ==========================================

        function hasValidClientId(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return false;

            }


            const clientId =
                String(value)
                    .trim();


            if (
                !clientId ||
                clientId.toLowerCase() === "null" ||
                clientId.toLowerCase() === "undefined"
            ) {

                return false;

            }


            return true;

        }


        // ==========================================
        // LOAD MEMBER DHAN INFORMATION
        // ==========================================

        async function loadMemberInfo() {

            try {

                const response =
                    await fetch(
                        `/member-dhan/info/${telegramId}`
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to load member information"
                    );

                }


                const member =
                    result.member;


                // ==================================
                // SHOW MEMBER NAME
                // ==================================

                memberInfo.textContent =
                    `👤 Member : ${member.name}`;


                // ==================================
                // CHECK EXISTING CLIENT ID
                // ==================================

                const validClientId =
                    hasValidClientId(
                        member.dhanClientId
                    );


                // ==================================
                // CLIENT ID EXISTS
                // ==================================

                if (validClientId) {

                    pageTitle.textContent =
                        "Update Today's Dhan Token";


                    dhanClientIdInput.value =
                        String(
                            member.dhanClientId
                        ).trim();


                    dhanClientIdInput.readOnly =
                        true;


                    dhanClientIdInput.style.backgroundColor =
                        "#eeeeee";


                    submitButton.textContent =
                        "Update Token";


                }

                // ==================================
                // NO CLIENT ID
                // ==================================

                else {

                    pageTitle.textContent =
                        "Connect Your Dhan Account";


                    dhanClientIdInput.value =
                        "";


                    dhanClientIdInput.readOnly =
                        false;


                    dhanClientIdInput.style.backgroundColor =
                        "";


                    submitButton.textContent =
                        "Connect Dhan";

                }

            }

            catch (err) {

                memberInfo.textContent =
                    `❌ ${err.message}`;

            }

        }


        // ==========================================
        // LOAD MEMBER INFO
        // ==========================================

        loadMemberInfo();


        // ==========================================
        // SUBMIT DHAN DETAILS
        // ==========================================

        form.addEventListener(

            "submit",

            async function (event) {

                event.preventDefault();


                const dhanClientId =
                    dhanClientIdInput
                        .value
                        .trim();


                const dhanAccessToken =
                    dhanAccessTokenInput
                        .value
                        .trim();


                // ==================================
                // VALIDATE CLIENT ID
                // ==================================

                if (
                    !hasValidClientId(
                        dhanClientId
                    )
                ) {

                    alert(
                        "Please enter a valid Dhan Client ID"
                    );

                    return;

                }


                // ==================================
                // VALIDATE TOKEN
                // ==================================

                if (!dhanAccessToken) {

                    alert(
                        "Please enter Today's Dhan Access Token"
                    );

                    return;

                }


                try {

                    submitButton.disabled =
                        true;


                    submitButton.textContent =
                        "Please wait...";


                    const response =
                        await fetch(

                            `/member-dhan/connect/${telegramId}`,

                            {

                                method: "POST",


                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },


                                body:
                                    JSON.stringify({

                                        dhanClientId,

                                        dhanAccessToken

                                    })

                            }

                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(

                            result.message ||
                            "Connection failed"

                        );

                    }


                    // ==================================
                    // SUCCESS
                    // ==================================

                    alert(
                        "✅ Dhan account updated successfully!"
                    );


                    // Clear token immediately
                    dhanAccessTokenInput.value =
                        "";


                    // Reload latest member info
                    await loadMemberInfo();


                }

                catch (err) {

                    alert(
                        `❌ ${err.message}`
                    );

                }

                finally {

                    submitButton.disabled =
                        false;

                }

            }

        );


    </script>

</body>

</html>
